# Redis 7 配置（本地开发档）
bind 0.0.0.0
protected-mode no
port 6379

# 内存策略
maxmemory 256mb
maxmemory-policy allkeys-lru

# 持久化：仅本地开发，关闭 AOF，保留 RDB 快照
appendonly no
save 900 1
save 300 10
save 60 10000

# 慢查询日志
slowlog-log-slower-than 10000
slowlog-max-len 128

# 客户端连接上限
maxclients 200

# 日志
loglevel notice
