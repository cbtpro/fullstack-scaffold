# fullstack-scaffold 全栈部署档：中间件 + gateway-service + user-service + web-react + web-vue
# 用法：docker compose -f docker/docker-compose.yml up -d --build

name: fullstack-scaffold

services:
  mysql:
    image: mysql:8.0
    container_name: fs-mysql
    restart: unless-stopped
    ports:
      # 宿主端口可覆盖：本机 3306 被占用时 MYSQL_PORT=13306 docker compose up -d
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: fs_user
      TZ: Asia/Shanghai
    volumes:
      - ./mysql/conf/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
      - fs-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fs-net

  redis:
    image: redis:7-alpine
    container_name: fs-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./redis/redis.conf:/etc/redis/redis.conf:ro
      - fs-redis-data:/data
    command: ["redis-server", "/etc/redis/redis.conf"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fs-net

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: fs-nacos
    platform: linux/amd64
    restart: unless-stopped
    ports:
      # 三个宿主端口均可覆盖：本机被占用时 NACOS_HTTP_PORT=18848 docker compose up -d
      - "${NACOS_HTTP_PORT:-8848}:8848"
      - "${NACOS_GRPC_PORT:-9848}:9848"
      - "${NACOS_GRPC_SERVER_PORT:-9849}:9849"
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
      TZ: Asia/Shanghai
    volumes:
      - ./nacos/conf/application.properties:/home/nacos/conf/application.properties:ro
      - fs-nacos-data:/home/nacos/data
      - fs-nacos-logs:/home/nacos/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8848/nacos/v1/console/health/readiness || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - fs-net

  user-service:
    build:
      # build context 为仓库根，Dockerfile 内 COPY backend/* 才能拿到父 pom 与 common/auth-starter
      context: ..
      dockerfile: docker/user-service/Dockerfile
    container_name: fs-user-service
    restart: unless-stopped
    ports:
      - "${USER_SERVICE_PORT:-8001}:8001"
    environment:
      MYSQL_HOST: fs-mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: root123
      REDIS_HOST: fs-redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      NACOS_ADDR: fs-nacos:8848
      NACOS_NAMESPACE: public
      AUTH_TYPE: ${AUTH_TYPE:-JWT}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-fullstack-scaffold-default-secret-please-change-it-32bytes}
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8001/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - fs-net

  gateway-service:
    build:
      context: ..
      dockerfile: docker/gateway-service/Dockerfile
    container_name: fs-gateway-service
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      NACOS_ADDR: fs-nacos:8848
      NACOS_NAMESPACE: public
      AUTH_TYPE: ${AUTH_TYPE:-JWT}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-fullstack-scaffold-default-secret-please-change-it-32bytes}
      TZ: Asia/Shanghai
    depends_on:
      nacos:
        condition: service_healthy
      user-service:
        condition: service_healthy
    networks:
      - fs-net

  web-react:
    build:
      context: ..
      dockerfile: docker/web-react/Dockerfile
    container_name: fs-web-react
    restart: unless-stopped
    ports:
      - "${WEB_REACT_PORT:-5173}:80"
    depends_on:
      gateway-service:
        condition: service_started
    networks:
      - fs-net

  web-vue:
    build:
      context: ..
      dockerfile: docker/web-vue/Dockerfile
    container_name: fs-web-vue
    restart: unless-stopped
    ports:
      - "${WEB_VUE_PORT:-5174}:80"
    depends_on:
      gateway-service:
        condition: service_started
    networks:
      - fs-net

volumes:
  fs-mysql-data:
  fs-redis-data:
  fs-nacos-data:
  fs-nacos-logs:

networks:
  fs-net:
    driver: bridge
