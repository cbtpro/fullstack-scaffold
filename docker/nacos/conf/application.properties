# Nacos v2.3.2 standalone 配置
# 容器内自定义配置，挂载到 /home/nacos/conf/application.properties

#***********************  Standalone 模式  ***********************#
# 使用内嵌 derby 数据库，无需外部 MySQL
nacos.standalone=true

#***********************  Web 服务  ***********************#
server.servlet.contextPath=/nacos
server.port=8848

#***********************  鉴权（本地开发：关闭） ***********************#
# 生产环境务必开启：nacos.core.auth.enabled=true
nacos.core.auth.enabled=false
nacos.core.auth.system.type=nacos

#***********************  gRPC 端口  ***********************#
# Nacos 2.x 需要 9848（client gRPC）与 9849（cluster gRPC）
nacos.grpc.sdk.port=9848
nacos.grpc.cluster.port=9849

#***********************  日志  ***********************#
nacos.naming.data.empty.log.auto-clean=true
nacos.naming.empty.log.auto-clean=true
