# 开发环境：外部依赖默认指向本机中间件，不设任何环境变量即可启动。
# compose 未显式指定 profile 时走的也是本档（application.yml 的缺省值 dev）。
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/fs_user?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}

auth:
  jwt:
    # 内置默认密钥仅限开发环境；非开发 profile 下 JwtSecretValidator 会拒绝启动
    secret: ${AUTH_JWT_SECRET:fullstack-scaffold-default-secret-please-change-it-32bytes}
  gateway:
    trust-secret: ${AUTH_GATEWAY_SECRET:fullstack-scaffold-dev-gateway-secret}

mybatis-plus:
  configuration:
    # 开发期打印 SQL，便于排查
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.scaffold: DEBUG
